name: Test

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: klangk
        # Skip Git LFS smudge: transitive deps (ag-ui) use LFS for test
        # fixtures we don't need; the smudge filter fails in CI without
        # LFS credentials for that repo.
        run: flutter pub get
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Run tests
        working-directory: klangk
        run: flutter test
